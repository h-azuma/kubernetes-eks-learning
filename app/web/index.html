<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkBoard</title>
  </head>
  <body>
    <main>
      <h1>WorkBoard</h1>
      <p>タスクを登録し、進み具合を記録しましょう。</p>
      <p id="message" role="status" aria-live="polite"></p>
      <section aria-labelledby="form-heading">
        <h2 id="form-heading">タスクを作成</h2>
        <form id="task-form">
          <label>タイトル<input id="title" name="title" required maxlength="120" /></label>
          <label>説明<textarea id="description" name="description" maxlength="2000" rows="3"></textarea></label>
          <label>ステータス<select id="status" name="status"></select></label>
          <div class="actions">
            <button id="save" type="submit">作成</button>
            <button id="cancel" type="button" hidden>編集をやめる</button>
          </div>
        </form>
      </section>
      <section aria-labelledby="list-heading">
        <h2 id="list-heading">タスク一覧</h2>
        <label>絞り込み<select id="filter"><option value="">すべて</option></select></label>
        <button id="refresh" type="button">再取得</button>
        <p id="empty" hidden>タスクがありません。</p>
        <ul id="tasks"></ul>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
