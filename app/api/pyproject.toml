[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workboard-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.2",
  "uvicorn==0.54.0",
  "SQLAlchemy==2.1.8",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.8",
  "pydantic==2.14.3",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
