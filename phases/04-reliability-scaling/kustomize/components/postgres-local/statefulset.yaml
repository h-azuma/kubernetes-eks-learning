apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: workboard-postgres
spec:
  serviceName: workboard-postgres
  replicas: 1
  selector:
    matchLabels:
      app: workboard-postgres
  template:
    metadata:
      labels:
        app: workboard-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17.11-bookworm
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: workboard-config
            - secretRef:
                name: workboard-db
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
