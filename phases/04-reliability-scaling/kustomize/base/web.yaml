apiVersion: apps/v1
kind: Deployment
metadata:
  name: workboard-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workboard-web
  template:
    metadata:
      labels:
        app: workboard-web
    spec:
      containers:
        - name: web
          image: workboard-web
          envFrom:
            - configMapRef:
                name: workboard-config
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: workboard-web
spec:
  type: ClusterIP
  selector:
    app: workboard-web
  ports:
    - port: 80
      targetPort: 80
