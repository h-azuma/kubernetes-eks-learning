apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: workboard
resources:
  - namespace.yaml
  - ../../base
components:
  - ../../components/postgres-ephemeral
# イメージの置き場所はダミーのアカウント ID。実際の値への差し替えは scripts/deploy.ps1|sh が行う。
images:
  - name: workboard-api
    newName: 111122223333.dkr.ecr.ap-northeast-1.amazonaws.com/workboard-api
    newTag: phase6
  - name: workboard-web
    newName: 111122223333.dkr.ecr.ap-northeast-1.amazonaws.com/workboard-web
    newTag: phase6
configMapGenerator:
  - name: workboard-config
    literals:
      - POSTGRES_HOST=workboard-postgres
      - POSTGRES_DB=workboard
      - POSTGRES_USER=workboard
      - API_HOST=workboard-api.workboard.svc.cluster.local
secretGenerator:
  - name: workboard-db
    envs:
      - secrets/db.env
