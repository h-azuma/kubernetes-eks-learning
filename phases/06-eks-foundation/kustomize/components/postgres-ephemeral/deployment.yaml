# 使い捨ての DB。emptyDir なので Pod が消えるとデータも消える。Phase 7 で RDS に置き換える（decisions/0012）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workboard-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: workboard-postgres
  template:
    metadata:
      labels:
        app: workboard-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17.11-bookworm
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: workboard-config
            - secretRef:
                name: workboard-db
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
