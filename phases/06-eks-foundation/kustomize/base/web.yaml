apiVersion: apps/v1
kind: Deployment
metadata:
  name: workboard-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workboard-web
  template:
    metadata:
      labels:
        app: workboard-web
    spec:
      containers:
        - name: web
          image: workboard-web
          envFrom:
            - configMapRef:
                name: workboard-config
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: workboard-web
spec:
  type: ClusterIP
  selector:
    app: workboard-web
  ports:
    - port: 80
      targetPort: 80
