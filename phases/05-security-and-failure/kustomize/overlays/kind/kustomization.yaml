apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: workboard
resources:
  - namespace.yaml
  - ../../base
components:
  - ../../components/postgres-local
images:
  - name: workboard-api
    newTag: kind
  - name: workboard-web
    newTag: kind
patches:
  - target:
      kind: Deployment|Job
      name: workboard-(api|web|migrate)
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
configMapGenerator:
  - name: workboard-config
    literals:
      - POSTGRES_HOST=workboard-postgres
      - POSTGRES_DB=workboard
      - POSTGRES_USER=workboard
      - API_HOST=workboard-api.workboard.svc.cluster.local
secretGenerator:
  - name: workboard-db
    envs:
      - secrets/db.env
