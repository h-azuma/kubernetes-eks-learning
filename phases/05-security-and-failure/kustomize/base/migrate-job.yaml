apiVersion: v1
kind: ServiceAccount
metadata:
  name: workboard-migrate
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: workboard-migrate
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: workboard-migrate
    spec:
      serviceAccountName: workboard-migrate
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: postgres:17.11-bookworm
          envFrom:
            - configMapRef:
                name: workboard-config
          command:
            - sh
            - -c
            - until pg_isready -h "$POSTGRES_HOST" -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
          securityContext:
            runAsUser: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: migrate
          image: workboard-api
          command: [alembic, upgrade, head]
          envFrom:
            - configMapRef:
                name: workboard-config
            - secretRef:
                name: workboard-db
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
