# 全 Pod の ingress/egress を拒否し、必要な経路だけを許可する。
# NetworkPolicy は対応する CNI（この Phase では Calico）がなければ作成できても効かない。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-traffic
spec:
  podSelector:
    matchLabels:
      app: workboard-web
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: workboard-loadgen
      ports:
        - { protocol: TCP, port: 80 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: workboard-api
      ports:
        - { protocol: TCP, port: 8000 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-traffic
spec:
  podSelector:
    matchLabels:
      app: workboard-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: workboard-web
      ports:
        - { protocol: TCP, port: 8000 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: workboard-postgres
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: migrate-egress
spec:
  podSelector:
    matchLabels:
      app: workboard-migrate
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: workboard-postgres
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
spec:
  podSelector:
    matchLabels:
      app: workboard-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: workboard-api
        - podSelector:
            matchLabels:
              app: workboard-migrate
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loadgen-egress
spec:
  podSelector:
    matchLabels:
      app: workboard-loadgen
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: workboard-web
      ports:
        - { protocol: TCP, port: 80 }
