apiVersion: v1
kind: ServiceAccount
metadata:
  name: workboard-api
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workboard-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workboard-api
  template:
    metadata:
      labels:
        app: workboard-api
    spec:
      serviceAccountName: workboard-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: workboard-api
          envFrom:
            - configMapRef:
                name: workboard-config
            - secretRef:
                name: workboard-db
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: workboard-api
spec:
  type: ClusterIP
  selector:
    app: workboard-api
  ports:
    - port: 8000
      targetPort: 8000
