# 故障実験: Service の selector が Pod のラベルと一致しない。復旧は kubectl apply -k kustomize/overlays/kind。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../kustomize/overlays/kind
patches:
  - target:
      kind: Service
      name: workboard-api
    patch: |-
      - op: replace
        path: /spec/selector/app
        value: workboard-apii
